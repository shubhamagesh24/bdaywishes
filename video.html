<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Sistaaa</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Poppins',sans-serif;color:#fff;background:linear-gradient(160deg,#2b0f3a,#6a1b5d 60%,#c2185b);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.box{width:100%;max-width:420px}
h1{font-family:'Great Vibes',cursive;font-weight:400;font-size:44px;color:#ffd27a;line-height:1.15;margin-bottom:6px}
p{font-weight:300;opacity:.9;margin-bottom:16px}
video{width:100%;max-height:72vh;border-radius:18px;background:#000;box-shadow:0 14px 40px rgba(0,0,0,.5)}
button{margin-top:16px;padding:13px 30px;border:none;border-radius:30px;font-size:16px;font-weight:600;color:#4a0d33;background:linear-gradient(135deg,#ffd27a,#ff9bc2);cursor:pointer;box-shadow:0 8px 20px rgba(255,150,190,.4)}
.song{margin-top:14px;font-size:14px;color:#ffd9e8}
</style></head><body>
<div class="box">
  <h1>Sistaaa 💖<br>Ithu ungalukkaga!</h1>
  <p>Happy Birthday 🎂🎶</p>
  <video id="v" src="us.mp4" controls playsinline preload="auto"></video>
  <button onclick="document.getElementById('v').play();this.style.display='none'">▶ Play 💖</button>
</div>
</body></html>
